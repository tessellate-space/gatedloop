# A weekly early warning (stability-contract D6): `gates run ci` and
# `gates doctor` on main against OpenSpec's latest release, outside the
# range bin/gates declares. It publishes no status and is never required;
# a failure shows as a red scheduled run, and pull-request ci on the
# declared range stays green. A break here is the cue to fix the shim and
# widen OPENSPEC_MAX_TESTED (and the ci matrix) in a change of its own.
name: openspec-latest

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scripts/release check reads v* tags
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @fission-ai/openspec@latest @anthropic-ai/claude-code
      - run: openspec --version
      - run: ./bin/gates doctor
      - run: ./bin/gates run ci
